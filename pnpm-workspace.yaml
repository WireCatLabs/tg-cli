# pnpm blocks dependencies' install scripts by default. Since pnpm 11 the key is `allowBuilds`,
# with an explicit boolean per package. better-sqlite3 is @mtcute/node's session storage and ships
# a native module that its install script fetches or builds.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@wirecat/*'

overrides:
  markdownlint-cli2>smol-toml: 1.9.0
  micromark-extension-math>katex: 0.18.2

  "vite@7.3.6": 7.3.7
  "vite@8.3.2": 8.3.3

  "zod@4.6.5": 4.6.7
