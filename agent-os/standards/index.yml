# Agent OS standards index — /inject-standards reads the descriptions to pick what applies.
bot:
  compound-calls:
    description: "Two-call operations report the half that succeeded"
  errors:
    description: "Bot API refusals map by HTTP status, not error_code"
  generated-api:
    description: "Generated Bot API code is never edited, and it decides policy"
  mapping:
    description: "map.ts declares only the Bot API fields it reads"
  secrets:
    description: "The bot token stays inside the transport"
  write-outcomes:
    description: "Every Bot API write passes { reads: false }"
cli:
  error-messages:
    description: "Error messages carry the next command"
  extending-shared-commands:
    description: "tg-only behaviour wraps shared commands, never forks them"
  help-and-output:
    description: "--help layout, and separate pretty and machine paths"
security:
  secret-input:
    description: "Secrets never on argv, stored only after a successful use"
telegram:
  adapter-call-boundary:
    description: "Every adapter method runs through #call / #write"
  error-text-privacy:
    description: "Error text never repeats what was typed"
  helper-modules:
    description: "Helper modules take a Pick<TelegramClient, …>"
  measured-behaviour:
    description: "Measured Telegram behaviour is a dated comment"
  write-idempotency:
    description: "Every write states whether repeating it is safe"
testing:
  adapter-fake-client:
    description: "Adapter tests: hoisted fake client, timings as exported constants"
  environment-seams:
    description: "Every side effect comes in through Environment and run()"
  leak-assertions:
    description: "Synthetic markers, and a check that they don't leak"
  profile-per-test:
    description: "One profile name per test"
  refuse-connection:
    description: "A command that must not connect gets a throwing adapter"
  string-recorders:
    description: "Record calls as short strings, assert with one toEqual"
typescript:
  optional-fields:
    description: "Optional fields are spread in, never set to undefined"
