name: Monthly validation

on:
  schedule:
    - cron: "6 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@cfcbfc9171bda47f758774b964344a8f5c7465df # v0.50.1
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
